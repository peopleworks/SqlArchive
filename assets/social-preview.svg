<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-labelledby="sqlarchive-social-title sqlarchive-social-desc">
  <title id="sqlarchive-social-title">SqlArchive — export a SQL Server database to a readable archive, restore it somewhere else, prove they match</title>
  <desc id="sqlarchive-social-desc">Social preview card. On the left, the source database Ventas: dbo.Cliente with 1,200 rows, ventas.Pedido with 8,500 rows, and dbo.Precio, a system-versioned table, with its history. In the middle, the archive Ventas.sqlarchive: manifest.json, the schema as numbered phases from 010 to 090, and one JSONL file per table; the manifest records, per table, the row count and a content hash, for example dbo.Cliente, 1,200 rows, hash 8a4617bb. On the right, sqlarchive verify against a copy where 30 rows of dbo.Cliente were updated: the row count reads 1,200 on both sides and sees nothing, while the hash goes from 8a4617bb to 61d73c51, so the content differs and verify exits 3. The callout reads: row counts can't see an UPDATE, the hash can.</desc>

  <rect x="0" y="0" width="1280" height="640" fill="#F7F6FC"/>

  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="50" font-size="40" font-weight="700" fill="#0F172A" letter-spacing="-0.5">SqlArchive</text>
    <text x="640" y="86" font-size="15" font-weight="700" letter-spacing="2.4" fill="#6D28D9">EXPORT IT — RESTORE IT — PROVE THE TWO MATCH</text>
  </g>

  <!-- ============ left card: the source database ============ -->
  <rect x="60" y="118" width="338" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="82" y="147" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6D28D9">SOURCE — THE DATABASE</text>
  <text x="82" y="177" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="700" fill="#0F172A">Ventas</text>

  <g>
    <rect x="80" y="196" width="298" height="126" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M 80 203 a 7 7 0 0 1 7 -7 h 284 a 7 7 0 0 1 7 7 v 23 h -298 Z" fill="#F1F5F9"/>
    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="80" y1="226" x2="378" y2="226"/>
      <line x1="80" y1="258" x2="378" y2="258"/>
      <line x1="80" y1="290" x2="378" y2="290"/>
      <line x1="260" y1="196" x2="260" y2="322"/>
    </g>
    <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">
      <text x="94" y="219">Table</text>
      <text x="364" y="219" text-anchor="end">Rows</text>
    </g>
    <g font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#1E293B">
      <text x="94" y="247">dbo.Cliente</text>
      <text x="94" y="279">ventas.Pedido</text>
      <text x="94" y="311">dbo.Precio</text>
      <g text-anchor="end">
        <text x="364" y="247">1,200</text>
        <text x="364" y="279">8,500</text>
        <text x="364" y="311" fill="#6D28D9" font-weight="700">+ history</text>
      </g>
    </g>
  </g>
  <text x="82" y="354" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#334155">dbo.Precio is system-versioned</text>

  <!-- arrows -->
  <g fill="#334155">
    <path d="M 411 246 h 14 v -7 l 14 12 -14 12 v -7 h -14 Z"/>
    <path d="M 842 246 h 14 v -7 l 14 12 -14 12 v -7 h -14 Z"/>
  </g>
  <g font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700"
     fill="#6D28D9" text-anchor="middle">
    <text x="425" y="228">export</text>
    <text x="856" y="228">import</text>
  </g>

  <!-- ============ center: the archive ============ -->
  <text x="640" y="147" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6D28D9" text-anchor="middle">THE ARCHIVE — ONE FILE YOU CAN READ</text>

  <rect x="452" y="164" width="376" height="192" rx="10" fill="#0F1B2E"/>
  <g font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace">
    <text x="474" y="193" font-size="14.5" font-weight="700" fill="#67E8F9">Ventas.sqlarchive</text>
    <text x="806" y="193" font-size="12.5" fill="#3D5A8A" text-anchor="end">zip</text>

    <g font-size="13.5">
      <text x="474" y="222" fill="#FCD34D">manifest.json</text>
      <text x="474" y="246" fill="#CFE0F5">schema/010…090_*.sql</text>
      <text x="474" y="270" fill="#6EE7B7">data/*.jsonl</text>
    </g>
    <g font-size="12.5" fill="#8FA3C4" text-anchor="end">
      <text x="806" y="222">rows + hash per table</text>
      <text x="806" y="246">run by hand, in order</text>
      <text x="806" y="270">one row per line</text>
    </g>

    <line x1="474" y1="286" x2="806" y2="286" stroke="#22304C" stroke-width="1"/>

    <g font-size="11.5" fill="#64748B">
      <text x="474" y="308">table</text>
      <text x="680" y="308" text-anchor="end">rows</text>
      <text x="704" y="308">hash</text>
    </g>
    <g font-size="13.5" font-weight="700">
      <text x="474" y="334" fill="#CFE0F5">[dbo].[Cliente]</text>
      <text x="680" y="334" fill="#CFE0F5" text-anchor="end">1,200</text>
      <text x="704" y="334" fill="#FCD34D">8a4617bb…</text>
    </g>
  </g>
  <text x="640" y="380" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="13" fill="#64748B" text-anchor="middle">plain SQL and JSONL, readable without the tool</text>

  <!-- ============ right card: verify against the copy ============ -->
  <rect x="884" y="118" width="336" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="906" y="147" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6D28D9">VERIFY --AGAINST THE COPY</text>
  <text x="906" y="177" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="700" fill="#0F172A">[dbo].[Cliente]</text>
  <text x="1198" y="177" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="12.5" fill="#64748B" text-anchor="end">30 rows updated</text>

  <!-- row count: sees nothing -->
  <rect x="904" y="196" width="298" height="58" rx="7" fill="#FFFBEB" stroke="#FDE68A"/>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700">
    <text x="918" y="215" fill="#92400E">rows</text>
    <text x="1188" y="215" fill="#B45309" text-anchor="end" font-weight="600">the count sees nothing</text>
  </g>
  <text x="918" y="241" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="700" fill="#B45309">1,200 = 1,200</text>

  <!-- hash: sees it -->
  <rect x="904" y="264" width="298" height="58" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700">
    <text x="918" y="283" fill="#991B1B">hash</text>
    <text x="1188" y="283" fill="#B91C1C" text-anchor="end">the content differs</text>
  </g>
  <text x="918" y="309" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="700" fill="#B91C1C">8a4617bb… → 61d73c51…</text>

  <text x="906" y="354" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#B91C1C">1 table differs — exit 3</text>

  <!-- ============ callout ============ -->
  <rect x="60" y="420" width="1160" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="108" cy="466" r="18" fill="#047857"/>
  <path d="M 100 466 l 6 6 l 11 -12" fill="none" stroke="#FFFFFF" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <text x="144" y="461" font-size="18.5" font-weight="700" fill="#0F172A">Row counts can’t see an UPDATE. The hash can.</text>
    <text x="144" y="487" font-size="14" fill="#475569">verify compares every table by schema, row count and content hash. A system-versioned table travels with its history.</text>
  </g>

  <!-- ============ footer ============ -->
  <text x="640" y="553" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">github.com/peopleworks/SqlArchive</text>
  <text x="640" y="580" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#94A3B8" text-anchor="middle">SQL SERVER 2016+ · .NET 9 · MIT · PEOPLEWORKS</text>
</svg>
